name: build and push an image to a docker hub

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build image
        run: |
          docker build ./backend/  -t  youssefbahri/erp_test:backend-latest
          docker build ./frontend/  -t  youssefbahri/erp_test:frontend-latest

      - name: push image
        run: |
          docker login -u youssefbahri -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push  youssefbahri/erp_test:backend-latest
          docker push  youssefbahri/erp_test:frontend-latest
